<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ site.title }}</title>
    <meta name="description" content="{{ site.description }}" />
    {% if site.keywords %}
    <meta name="keywords" content="{{ site.keywords }}" />
    {% endif %}
    {% if site.canonical %}
    <link rel="canonical" href="{{ site.canonical }}" />
    {% endif %}

    <link rel="icon" href="{{ site.favicon }}" type="image/png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.4/css/academicons.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./assets/css/homepage.css?v=20261123b" />
  </head>
  <body>
    <header class="site-nav">
      <div class="nav-inner">
        <a class="nav-brand" href="#hero">{{ site.title }}</a>
        <nav class="nav-links" aria-label="Primary Navigation">
          <a href="#about">About</a>
          <a href="#news">News</a>
          <a href="#publications">Publications</a>
          <a href="#projects">Projects</a>
          <a href="#honors">Honors</a>
          <a href="#skills">Skills</a>
          {% if site.cv_link %}
          <a href="{{ site.cv_link }}" target="_blank" rel="noopener">CV</a>
          {% endif %}
        </nav>
      </div>
    </header>

    <main class="page-container">
      {{ content }}
    </main>

    <footer class="site-footer">
      <span>&copy; {{ "now" | date: "%Y" }} {{ site.title }}.</span>
      <span>Last updated: {{ "now" | date: "%b %Y" }}</span>
    </footer>

    <div id="photo-lightbox" class="lightbox" hidden>
      <button type="button" class="lightbox-close" aria-label="Close photo">&times;</button>
      <img id="lightbox-img" src="" alt="Full size photography" />
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Photo Lightbox
        var lightbox = document.getElementById("photo-lightbox");
        var lightboxImg = document.getElementById("lightbox-img");
        var lightboxClose = lightbox ? lightbox.querySelector(".lightbox-close") : null;

        document.querySelectorAll(".stack-card").forEach(function (card) {
          card.addEventListener("click", function () {
            var src = card.getAttribute("data-src");
            if (lightbox && lightboxImg && src) {
              lightboxImg.src = src;
              lightbox.hidden = false;
            }
          });
        });

        function closeLightbox() {
          if (lightbox) {
            lightbox.hidden = true;
            if (lightboxImg) lightboxImg.src = "";
          }
        }

        if (lightboxClose) lightboxClose.addEventListener("click", closeLightbox);
        if (lightbox) {
          lightbox.addEventListener("click", function (e) {
            if (e.target === lightbox) closeLightbox();
          });
        }
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") closeLightbox();
        });
        // Toggle BibTeX boxes
        document.querySelectorAll(".btn-bib").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var targetId = btn.getAttribute("data-target");
            var box = document.getElementById(targetId);
            if (box) {
              box.hidden = !box.hidden;
            }
          });
        });

        // Copy BibTeX
        document.querySelectorAll(".btn-copy-bib").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var codeId = btn.getAttribute("data-copy-target");
            var codeEl = document.getElementById(codeId);
            if (!codeEl) return;
            navigator.clipboard.writeText(codeEl.textContent).then(function () {
              var oldText = btn.textContent;
              btn.textContent = "Copied!";
              setTimeout(function () {
                btn.textContent = oldText;
              }, 1500);
            });
          });
        });

        // Highlight active nav link on scroll
        var sections = document.querySelectorAll("section[id]");
        var navLinks = document.querySelectorAll(".nav-links a[href^='#']");
        function onScroll() {
          var scrollY = window.scrollY + 110;
          var currentId = "";
          sections.forEach(function (sec) {
            if (sec.offsetTop <= scrollY) {
              currentId = sec.getAttribute("id");
            }
          });
          navLinks.forEach(function (link) {
            link.classList.toggle("active", link.getAttribute("href") === "#" + currentId);
          });
        }
        window.addEventListener("scroll", onScroll, { passive: true });
        onScroll();
      });
    </script>
  </body>
</html>
